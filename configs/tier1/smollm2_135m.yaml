# Tier-1 pilot plan (frozen at the preregistration freeze).
#
# Purpose: the cheap, mandatory cloud pilot that validates the proxy ranking and the method arms
# before any Tier-2 claim. It is the plan the M4 proxy-validation gate executes.
#
# Substrate: Google Colab (the developer's chosen vehicle, AGENTS.md section 2b). Consumer Colab has
# no submission API, so the notebook is GENERATED and run by the developer:
#   uv run spectraquant cloud notebook --config configs/tier1/smollm2_135m.yaml --platform colab
#
# Every value here is the frozen value referenced by docs/research/preregistration.md section 13.
name: tier1_smollm2_135m
substrate: colab
tier: 1
device: cpu

models:
  - id: HuggingFaceTB/SmolLM2-135M
    revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
    license: apache-2.0
    parameters: 134515008
    role: Tier-1 pilot model (bounded reproduction + proxy validation)

datasets:
  - name: EleutherAI/wikitext_document_level
    revision: 647234772b9554e208af6c826f23b99e3cac88c8
    license: cc-by-sa-3.0
    config: wikitext-2-raw-v1
    roles: [development, test_perplexity]
  - name: allenai/c4
    revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
    license: odc-by
    config: en
    roles: [train, calibration]

seeds:
  master: 20261008
  derived:
    init: 20261009
    data_order: 20261010
    calibration_sampling: 20261011
    probe_sampling: 20261012
  reported: [0, 1, 2, 3, 4]
  floor: 5

grid:
  bits: [2, 3, 4, 8]
  ranks: [2, 4, 8, 16, 32]
  group_sizes: [32, 64, 128]
  # Stored-byte targets (class 3) as fractions of the fp16 checkpoint (269 060 552 B):
  # 10 %, 15 %, 20 %, 25 %, 33 %.
  budget_ladder_bytes: [26906055, 40359082, 53812110, 67265138, 88789981]

arms:
  - name: fp16_reference
    kind: fp16_reference
    trainable: false
    notes: uncompressed reference; every other arm is compared at equal stored bytes
  - name: ptq_uniform_8
    kind: ptq_uniform
    trainable: false
    point: {bits: 8}
  - name: ptq_uniform_4
    kind: ptq_uniform
    trainable: false
    point: {bits: 4}
  - name: low_rank_only
    kind: low_rank_only
    trainable: false
    point: {rank: 8}
  - name: rank_then_quant
    kind: rank_then_quant
    trainable: false
    point: {bits: 4, rank: 8}
    notes: the naive baseline whose proxy failure is published (design note section 7)
  - name: quant_then_residual
    kind: quant_then_residual
    trainable: false
  - name: proxy_allocated
    kind: proxy_allocated
    trainable: false
  - name: spectraquant_regularized
    kind: proxy_allocated_regularized
    trainable: true
    notes: the H3 arm; training happens on the cloud substrate only

harness:
  commit: ddd67220430a2470529f25fd5c05a576ca1057a0
  release: v0.4.13
  tasks: [hellaswag, arc_easy, arc_challenge, piqa, winogrande, boolq]
  few_shot: "10,25,25,0,5,0"
  perplexity_split: wikitext-2 test (document level)

# Placeholder schedule, NOT a measured one: the project has not yet measured the cost of a single
# step on the GPU substrate, so these values only declare the optimization shape. The orchestrator
# pins `steps` (and re-checks the rest) from a measured step cost before any billed run; until then
# the cost ceiling below is not a derived quantity.
training:
  steps: 200
  learning_rate: 2.0e-4
  batch_size: 8
  seq_len: 512
  warmup_steps: 20
  grad_clip: 1.0
  optimizer: adamw
  eval_every: 50
  checkpoint_every: 100

cost:
  platform_hours_max: 6.0
  max_cost_authorized_usd: 0.0
  free_tier_only: true

measurement_classes: [1, 2, 3, 4]

notes: >
  Tier-1 pilot. No GPU-hour may be spent on this plan beyond the free-tier ceiling; if the free-tier
  quota binds, the plan is recorded as incomplete rather than silently reduced (preregistration
  section 10).
