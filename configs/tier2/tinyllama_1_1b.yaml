# Tier-2 primary plan (frozen at the preregistration freeze).
#
# Purpose: the claim-bearing configuration named by the scope ladder (AGENTS.md section 6) —
# TinyLlama-1.1B-class + WikiText-2, FP16/PTQ/QLoRA/LoftQ/LR-QAT vs SpectraQuant at equal stored
# bytes, three seeds. Nothing here has been run: a Tier-2 number exists only after a validated
# cloud run bundle (AGENTS.md section 2b rules 3-5).
#
#   uv run spectraquant cloud notebook --config configs/tier2/tinyllama_1_1b.yaml --platform colab
name: tier2_tinyllama_1_1b
substrate: colab
tier: 2
device: cpu

models:
  - id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    revision: fe8a4ea1ffedaf415f4da2f062534de366a451e6
    license: apache-2.0
    parameters: 1100048384
    role: Tier-2 primary model (the claim-bearing reference reproduction)

datasets:
  - name: EleutherAI/wikitext_document_level
    revision: 647234772b9554e208af6c826f23b99e3cac88c8
    license: cc-by-sa-3.0
    config: wikitext-2-raw-v1
    roles: [development, test_perplexity]
  - name: allenai/c4
    revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
    license: odc-by
    config: en
    roles: [train, calibration]

seeds:
  master: 20261008
  derived:
    init: 20261009
    data_order: 20261010
    calibration_sampling: 20261011
  reported: [0, 1, 2]
  floor: 3

grid:
  bits: [2, 3, 4, 8]
  ranks: [2, 4, 8, 16, 32]
  group_sizes: [32, 64, 128]
  # Stored-byte targets (class 3) as fractions of the fp16 checkpoint (1 100 048 384 B):
  # 10 %, 15 %, 20 %, 25 %, 33 %.
  budget_ladder_bytes: [110004838, 165007258, 220009677, 275012096, 363015967]

arms:
  - name: fp16_reference
    kind: fp16_reference
    trainable: false
  - name: ptq_uniform_8
    kind: ptq_uniform
    trainable: false
  - name: ptq_uniform_4
    kind: ptq_uniform
    trainable: false
  - name: low_rank_only
    kind: low_rank_only
    trainable: false
  - name: rank_then_quant
    kind: rank_then_quant
    trainable: false
  - name: quant_then_residual
    kind: quant_then_residual
    trainable: false
  - name: qlora
    kind: qlora
    trainable: true
  - name: loftq
    kind: loftq
    trainable: true
  - name: lr_qat
    kind: lr_qat
    trainable: true
  - name: spectraquant_no_allocator
    kind: spectraquant
    trainable: true
  - name: spectraquant_allocated
    kind: proxy_allocated
    trainable: true

harness:
  commit: ddd67220430a2470529f25fd5c05a576ca1057a0
  release: v0.4.13
  tasks: [hellaswag, arc_easy, arc_challenge, piqa, winogrande, boolq]
  few_shot: "10,25,25,0,5,0"
  perplexity_split: wikitext-2 test (document level)

cost:
  platform_hours_max: 12.0
  max_cost_authorized_usd: 0.0
  free_tier_only: true

measurement_classes: [1, 2, 3, 4]

notes: >
  Tier-2 is claim-bearing. The plan may not be started until the M3 reproduction gate has passed on
  the Tier-1 pilot, and a Tier-2 result exists only once its artifact bundle passes checksum
  validation. The 12 GPU-hour ceiling is a free-tier envelope; exceeding it requires an explicit
  authorization recorded in the amendments file before submission.
