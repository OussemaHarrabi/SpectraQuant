[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spectraquant"
version = "0.1.0.dev0"
description = "Budget-Aware Joint Low-Rank and Low-Bit Training for Efficient Transformers (research scaffold)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oussema Harrabi" }]
keywords = ["quantization", "low-rank", "transformers", "compression", "research"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies are intentionally minimal: no CUDA-only packages, no bitsandbytes,
# no vLLM, no lm-evaluation-harness. See AGENTS.md section 2 and ADR-0002.
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "pyright>=1.1.380",
]
# The single experiment tracker (ADR-0003). `mlflow-skinny` has no server or UI dependencies:
# runs are logged to the local `mlruns/` directory (git-ignored).
track = ["mlflow-skinny>=2.16"]
# Pretrained Hugging Face model/tokenizer loading and pinned dataset revisions for the remote plan
# runner (`spectraquant run-plan`). `src/spectraquant/cloud/plan_runner.py` and
# `src/spectraquant/cloud/plan_data.py` import these lazily and raise a clear error naming this
# extra when they are missing, so the core dependency list stays free of them (AGENTS.md section 7).
# `datasets>=2.20,<3` is deliberate: the frozen plans pin dataset *commits* (e.g.
# EleutherAI/wikitext_document_level @ 647234772b9554e208af6c826f23b99e3cac88c8), and the 3.x line
# dropped loading-script support, which would make a commit pin unloadable (the Hub's Parquet
# conversion lives on a branch, not on the pinned commit). A run that cannot honour the pin must fail
# loudly rather than silently use an unpinned revision.
models = ["transformers>=4.44,<5", "datasets>=2.20,<3"]
# Cloud execution substrate (AGENTS.md section 2b): notebook generation and Kaggle submission for
# `src/spectraquant/cloud/**`. That package imports these lazily and raises a clear error naming
# this extra when they are missing, so the core dependency list stays free of them.
cloud = ["nbformat>=5.10", "kaggle>=1.7"]
# Constrained optimizer for the layer-wise rank/bit allocator (Milestone 4, allocator slice).
# `src/spectraquant/allocation/**` imports it lazily and raises naming this extra when it is absent.
alloc = ["ortools>=9.11"]
# Class 4-CPU kernel path (AGENTS.md section 5): ONNX Runtime's CPU `MatMulNBits` (int4
# weight-only) and `MatMulInteger` (int8) kernels executing artifacts SpectraQuant serializes
# itself, plus the torchao intx weight-only kernels. The `~=` constraints are the releases
# verified on the workstation of record (docs/research/backend-capability.md section 2.4):
# onnx 1.23.2, onnxruntime 1.30.0, onnx-ir 1.0.0, torchao 0.18.0. No core module imports these;
# the quantization slice imports them lazily and names this extra when they are missing.
onnx = [
  "onnx~=1.23.2",
  "onnxruntime~=1.30.0",
  "onnx-ir~=1.0.0",
  "torchao~=0.18.0",
]
# Verification-only oracle: the M3 exactness gate T2-a compares our LoftQ T=1 initialisation against
# PEFT's `loftq_init` (`docs/research/reproduction-plan.md` section 5.3, tolerance <= 1e-6 relative
# Frobenius). PEFT is an *independent implementation* of the same published procedure, which is the
# only way to show our convention is right rather than self-consistent; nothing in `src/**` imports it,
# and the gate skips with a stated reason when the extra is absent. Apache-2.0.
verify = ["peft>=0.13,<1"]

[project.scripts]
spectraquant = "spectraquant.cli.main:app"

[project.urls]
Repository = "https://github.com/OussemaHarrabi/SpectraQuant"

[tool.hatch.build.targets.wheel]
packages = ["src/spectraquant"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "artifacts", "docs", "scripts"]

# --------------------------------------------------------------------------------------
# uv: CPU-only PyTorch, cross-platform.
# `explicit = true` means this index serves ONLY the packages listed in [tool.uv.sources],
# so no other dependency can accidentally be resolved from the PyTorch index.
# --------------------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# --------------------------------------------------------------------------------------
# Ruff: lint + format
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["artifacts", "outputs", "notebooks", "reports", "docker", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501", # line length is enforced by the formatter
  "RUF001", # ambiguous unicode: em dashes appear in docstrings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
# Typer's documented API is `x: T = typer.Option(...)` in the signature; B008 does not apply.
"src/spectraquant/cli/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

# --------------------------------------------------------------------------------------
# Pyright: type checking of the shipped package only (`src/spectraquant`).
# Test files and throwaway scripts are excluded; third-party stubs are not required.
# --------------------------------------------------------------------------------------
[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = true
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUnnecessaryIsInstance = false
venvPath = "."
venv = ".venv"

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: end-to-end tests that train a tiny model (still CPU-fast)",
  "regression: guards committed artifacts against the published schema",
]

[tool.coverage.run]
source = ["src/spectraquant"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
